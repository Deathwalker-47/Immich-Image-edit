version: '3.8'

services:
  immich-ai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immich-ai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3778}:3778"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - IMMICH_INTERNAL_URL=${IMMICH_INTERNAL_URL:-http://immich-server:2283}
      - IMMICH_PUBLIC_URL=${IMMICH_PUBLIC_URL}
      - IMMICH_API_KEY=${IMMICH_API_KEY}
      - FAL_KEY=${FAL_KEY}
      - RUNWARE_API_KEY=${RUNWARE_API_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - ATLAS_API_KEY=${ATLAS_API_KEY}
      - AI_EDITS_ALBUM_NAME=${AI_EDITS_ALBUM_NAME:-AI Edits}
    networks:
      - immich_default
      - editor_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3778/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  immich-ai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=http://localhost:${BACKEND_PORT:-3778}
    container_name: immich-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3777}:80"
    depends_on:
      immich-ai-backend:
        condition: service_healthy
    networks:
      - editor_internal

networks:
  immich_default:
    external: true
  editor_internal:
    driver: bridge
