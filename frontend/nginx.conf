server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://immich-ai-backend:3778;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A LoRA edit can legitimately run for several minutes. Measured against
        # Replicate's flux-kontext-dev-lora: the queue wait alone was 128-226s
        # before the model even started, and predict time then ranged 4.6-237.6s,
        # so total round-trips of 300-460s are normal for that provider rather
        # than a hang. At the previous 120s this proxy returned 504 while the
        # prediction was still running and went on to succeed upstream, so the
        # user was billed for an edit they never saw. The host-level vhost for
        # gedit.midnighttavern.online must be at least this generous too — it is
        # the outer proxy, and the smaller of the two always wins.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Allow large image uploads
        client_max_body_size 50m;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Security headers (no X-Frame-Options — must work inside mobile WebViews)
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
